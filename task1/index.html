<!DOCTYPE html>
<html>
<body>
  <h2>Task1 Test (Check console)</h2>

  <script type="module">
    import PromiseHttpClient from './async/PromiseHttpClient.js';
    import { withRetry } from './async/retry.js';
    import { AsyncQueue } from './async/AsyncQueue.js';

    const client = new PromiseHttpClient('https://jsonplaceholder.typicode.com');

    // Retry test
    async function testRetry() {
      const result = await withRetry(() => client.get('/posts/1'));
      console.log('Retry result:', result);
    }

    // Queue test
    async function testQueue() {
      const queue = new AsyncQueue(2);

      const tasks = [1,2,3,4,5].map(i => () =>
        client.get(`/posts/${i}`)
      );

      const results = await queue.addAll(tasks);
      console.log('Queue results:', results);
      console.log('Stats:', queue.getStats());
    }

    testRetry();
    testQueue();
  </script>
</body>
</html>
